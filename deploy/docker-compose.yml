services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # 当前 CentOS/Docker 默认 seccomp 会阻断 PostgreSQL WAL 初始化。
    # 仅对数据库放开 seccomp，不使用 privileged，API/Worker 保持默认隔离。
    security_opt:
      - seccomp=unconfined
    environment:
      POSTGRES_DB: ${DB_NAME:-fb_ads_db}
      POSTGRES_USER: ${DB_USER:-fbads}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fbads} -d ${DB_NAME:-fb_ads_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [fbnet]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >-
      sh -c '[ -n "$$REDIS_PASSWORD" ] && redis-server --requirepass "$$REDIS_PASSWORD" || redis-server'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redisdata:/data
    networks: [fbnet]

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: fbads-api:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    networks: [fbnet]
    # 本地 Vite 开发环境需要直接代理到 API；生产环境可通过 nginx 内网访问。
    ports:
      - "8000:8000"

  celery-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: fbads-api:latest
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    networks: [fbnet]

  celery-beat:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: fbads-api:latest
    restart: unless-stopped
    command: celery -A celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      redis:
        condition: service_started
    networks: [fbnet]

  nginx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    image: fbads-nginx:latest
    restart: unless-stopped
    # CentOS 7 默认 seccomp 会阻断 Nginx 写入 PID 文件所需的 pwrite。
    security_opt:
      - seccomp=unconfined
    ports:
      # 未备案期间通过公网 IP:8094 访问；备案后可改回 127.0.0.1:8094 并由 Caddy 反代。
      - "8094:80"
    depends_on:
      - api
    networks: [fbnet]

volumes:
  pgdata:
  redisdata:
  uploads:
  logs:

networks:
  fbnet:
    driver: bridge
