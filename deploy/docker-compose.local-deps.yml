services:
  postgres:
    image: postgres:16-alpine
    container_name: fb-ads-postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${DB_NAME:-fb_ads_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - fbads_pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-fb_ads_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fb-ads-redis
    restart: unless-stopped
    env_file:
      - ../.env
    command: >-
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
      redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
      else
      redis-server --appendonly yes;
      fi'
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - fbads_redisdata_local:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi | grep PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  fbads_pgdata_local:
  fbads_redisdata_local:
