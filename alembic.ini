# Alembic configuration
#
# NOTE: sqlalchemy.url is intentionally left empty here.
# The real DSN is injected in migrations/env.py from config.settings
# so that database passwords never live in this file.
#
# NOTE: keep this file ASCII-only. On Windows with a Chinese locale,
# configparser reads it using the GBK codec and non-ASCII bytes raise
# UnicodeDecodeError.
#
# Common commands:
#   alembic revision --autogenerate -m "message"   # generate migration
#   alembic upgrade head                           # upgrade to latest
#   alembic downgrade -1                           # roll back one step
#   alembic current                                # show current revision
#   alembic history                                # show history
[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# DSN injected by env.py
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
